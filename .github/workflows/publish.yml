name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no API tokens stored anywhere.
# Runs automatically when a GitHub Release is published; workflow_dispatch
# covers releases that predate this workflow or need a re-run.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (e.g. v1.7.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI OIDC trusted publishing
      contents: read

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A PyPI version can never be re-uploaded, so refuse a tag that doesn't
      # match the version being built
      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${RELEASE_TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Run tests
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -q

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
